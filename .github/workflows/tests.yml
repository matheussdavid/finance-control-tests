name: QA Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # URLs locais (app sobe via docker compose no próprio runner)
  BASE_URL: http://localhost:5173
  API_BASE_URL: http://localhost:8080
  BROWSER: chrome
  HEADLESS: "true"
  # Senha sintética dos usuários de teste (não é secret real)
  DEFAULT_PASSWORD: Passw0rd!123
  # JWT_SECRET exigido pelo docker-compose do app (>= 32 chars, valor de teste)
  JWT_SECRET: finance-control-tests-ci-jwt-secret-2026

jobs:
  api:
    name: API + Contract + DB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (test repo)
        uses: actions/checkout@v7

      # Repositório do app sob teste — se privado, use um PAT no secret APP_REPO_TOKEN
      - name: Checkout (app repo)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/finance-control
          path: finance-control
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start finance-control
        working-directory: finance-control
        run: |
          cp -n .env.example .env || true
          docker compose up --build -d
          echo 'Aguardando a API...'
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v3/api-docs >/dev/null 2>&1; then
              echo 'API pronta!'
              exit 0
            fi
            sleep 2
          done
          echo 'API não respondeu a tempo'
          docker compose logs --tail 40
          exit 1

      - name: Run API, Contract and DB tests
        run: mvn clean test -Dgroups=api --batch-mode

      - name: Upload reports (API + Contract + DB)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-api
          path: |
            target/surefire-reports/
            target/allure-results/
            target/logs/
          retention-days: 14

      - name: Shutdown app
        if: always()
        working-directory: finance-control
        run: docker compose down -v

  web:
    name: Web (Selenium)
    needs: api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (test repo)
        uses: actions/checkout@v7

      - name: Checkout (app repo)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/finance-control
          path: finance-control
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start finance-control
        working-directory: finance-control
        run: |
          cp -n .env.example .env || true
          docker compose up --build -d
          echo 'Aguardando a API...'
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v3/api-docs >/dev/null 2>&1; then
              echo 'API pronta!'
              exit 0
            fi
            sleep 2
          done
          echo 'API não respondeu a tempo'
          docker compose logs --tail 40
          exit 1

      # Chrome já vem instalado no runner ubuntu-latest; o Selenium Manager
      # resolve o chromedriver automaticamente.
      - name: Run Web tests
        run: mvn clean test -Dgroups=web --batch-mode

      - name: Upload reports + evidence (Web)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-web
          path: |
            target/surefire-reports/
            target/allure-results/
            target/screenshots/
            target/logs/
          retention-days: 14

      - name: Shutdown app
        if: always()
        working-directory: finance-control
        run: docker compose down -v

  report:
    name: Allure Report
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (test repo)
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download results (api)
        uses: actions/download-artifact@v7
        with:
          name: test-reports-api
          path: api

      - name: Download results (web)
        uses: actions/download-artifact@v7
        with:
          name: test-reports-web
          path: web

      - name: Merge allure-results
        run: |
          mkdir -p target/allure-results
          cp -a api/allure-results/. target/allure-results/
          cp -a web/allure-results/. target/allure-results/

      # history.jsonl (trends) sobrevive entre runs via cache do runner
      - name: Restore/Cache Allure history
        uses: actions/cache@v4
        with:
          path: .allure/history
          key: allure-history-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-

      - name: Generate Allure report
        run: mvn allure:report --batch-mode

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 14

  deploy:
    name: Deploy Allure on GitHub Pages
    needs: report
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (test repo)
        uses: actions/checkout@v7

      - name: Download Allure report
        uses: actions/download-artifact@v7
        with:
          name: allure-report
          path: allure-report

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4